<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daraja testi — Registon o‘quv markazi</title>
<meta name="description" content="Ingliz tili, rus tili (CEFR) va matematika bo‘yicha bepul daraja testi. Бесплатный тест уровня по английскому, русскому языку и математике.">
<meta name="theme-color" content="#E75225">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 74 52'%3E%3Cpath fill='%23e75225' d='M0 35.8h67.4V52H0z'/%3E%3Cpath fill='%23e75225' d='M72.6.2c-3 1.7-7 3.3-15 3.5-6 .2-14 .5-19.4 6.3-3 3.4-4.3 10-4.6 16.1C32 16 26 5.6 13.5 5.9 6 6.2 2 9.5 0 13.4v12.8c4-2.5 10-3.7 16.3-3.6 8.5.2 15 2.8 17.3 8.8 3-7 9-9.5 23-10.2 11.5-.7 16.4-6.5 16.4-18.6V0z'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* ===== Registon brend ranglari ===== */
  :root{
    --orange:#E75225; --orange-400:#EC703E; --orange-100:#F8C1A4; --orange-50:#FCDECC; --orange-25:#FEF2EB; --orange-700:#B83A0E;
    --black:#1D1D1B; --graphite:#333333; --white:#FFFFFF;
    --gray-600:#5C5C58; --gray-300:#B5B5B0; --gray-200:#E3E2DF; --gray-100:#F6F5F3;
    --ok:#1F8A4C; --sans:"Helvetica Neue",Helvetica,Inter,Arial,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--white);color:var(--black);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font-family:inherit;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  .narrow{max-width:760px}
  :focus-visible{outline:3px solid var(--orange-100);outline-offset:2px}

  /* ---------- HEADER ---------- */
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
  header.scrolled{border-color:var(--gray-200);box-shadow:0 8px 24px -20px rgba(29,29,27,.35)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .brand{background:none;border:0;cursor:pointer;display:flex;align-items:center;padding:6px 4px;border-radius:6px}
  .brand svg{height:36px;width:auto;overflow:visible}
  .brand .mk-top,.brand .mk-bar{transform-box:fill-box;transition:transform .5s var(--ease)}
  .brand .mk-top{transform-origin:0% 100%}
  .brand .mk-bar{transform-origin:0% 50%}
  .brand .word{transition:opacity .3s}
  .brand:hover .mk-top{transform:translateY(-3px) rotate(-4deg)}
  .brand:hover .mk-bar{transform:scaleX(1.08)}
  .brand.intro .mk-top{animation:mkTop .9s var(--ease) both}
  .brand.intro .mk-bar{animation:mkBar .7s var(--ease) both}
  .brand.intro .word{animation:word .6s .35s var(--ease) both}
  @keyframes mkTop{from{transform:translateY(-14px) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes mkBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes word{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .hright{display:flex;align-items:center;gap:18px}
  .crumb{font-size:14px;color:var(--gray-600);font-weight:600}
  /* til almashtirgich */
  .lang{position:relative;display:flex;background:var(--gray-100);border-radius:999px;padding:4px;border:1px solid var(--gray-200)}
  .lang button{position:relative;z-index:1;border:0;background:none;font-size:13px;font-weight:800;letter-spacing:.04em;padding:7px 13px;border-radius:999px;cursor:pointer;color:var(--gray-600);transition:color .25s}
  .lang button.on{color:var(--white)}
  .lang .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--orange);transition:transform .35s var(--ease),width .35s var(--ease);box-shadow:0 4px 10px -4px rgba(231,82,37,.7)}

  .screen{display:none}
  .screen.active{display:block;animation:in .45s var(--ease)}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* ---------- TUGMALAR ---------- */
  .btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--orange);color:var(--white);border:0;border-radius:10px;padding:16px 26px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .2s,transform .2s var(--ease),box-shadow .25s;box-shadow:0 10px 22px -12px rgba(231,82,37,.75)}
  .btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease)}
  .btn:hover::before{transform:translateX(120%)}
  .btn:hover{background:var(--orange-400);transform:translateY(-2px);box-shadow:0 16px 28px -14px rgba(231,82,37,.85)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn .ar{display:inline-block;transition:transform .3s var(--ease)}
  .btn:hover .ar{transform:translateX(4px)}
  .btn:hover .ar.down{transform:translateY(3px)}
  .btn.dark{background:var(--black);box-shadow:0 10px 22px -14px rgba(29,29,27,.8)} .btn.dark:hover{background:var(--graphite)}
  .btn.ghost{background:var(--white);color:var(--black);border:1.5px solid var(--gray-200);box-shadow:none}
  .btn.ghost:hover{border-color:var(--black)}
  .btn.block{width:100%}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none;z-index:-1}
  .ghost .ripple,.opt .ripple,.subj .ripple{background:rgba(231,82,37,.18)}
  @keyframes rip{to{transform:scale(1);opacity:0}}

  /* ---------- HERO ---------- */
  .hero{padding:64px 0 60px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;right:-180px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(231,82,37,.13),transparent 65%);pointer-events:none}
  .hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;position:relative}
  .kicker{font-size:14px;font-weight:700;color:var(--orange-700);letter-spacing:.04em;text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:10px}
  .kicker i{width:28px;height:3px;background:var(--orange);display:block;border-radius:2px}
  .hero h1{font-size:clamp(38px,5.6vw,60px);line-height:1.04;letter-spacing:-.025em;font-weight:800;margin-bottom:20px}
  .hero h1 span{color:var(--orange);position:relative;white-space:nowrap}
  .hero h1 span::after{content:"";position:absolute;left:0;right:0;bottom:.02em;height:.12em;background:var(--orange-50);z-index:-1;transform:scaleX(0);transform-origin:left;animation:under .8s .5s var(--ease) forwards;border-radius:4px}
  @keyframes under{to{transform:scaleX(1)}}
  .hero p.lead-p{color:var(--gray-600);font-size:18px;max-width:520px;margin-bottom:28px}
  .facts{display:flex;gap:30px;margin-top:36px;flex-wrap:wrap}
  .facts div b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .facts div span{font-size:14px;color:var(--gray-600)}
  /* zinapoya */
  .ltabs{display:inline-flex;gap:4px;background:var(--gray-100);padding:4px;border-radius:10px;margin-bottom:22px}
  .ltabs button{border:0;background:none;padding:8px 14px;border-radius:7px;font-size:14px;font-weight:700;color:var(--gray-600);cursor:pointer;transition:background .2s,color .2s}
  .ltabs button.on{background:var(--white);color:var(--black);box-shadow:0 2px 8px -4px rgba(0,0,0,.25)}
  .ladder{display:flex;align-items:flex-end;gap:10px;height:290px;padding:0 6px;border-bottom:3px solid var(--black)}
  .ladder .st{flex:1;background:var(--gray-100);border-radius:8px 8px 0 0;position:relative;cursor:pointer;transition:background .3s,transform .3s var(--ease);transform-origin:bottom;animation:grow .7s var(--ease) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .ladder .st:hover{transform:translateY(-6px)}
  .ladder .st.on{background:var(--orange);box-shadow:0 14px 26px -16px rgba(231,82,37,.9)}
  .ladder .st.on b{color:var(--white)}
  .ladder .st b{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:18px;font-weight:800;color:var(--black);transition:color .25s}
  .ladder .st small{position:absolute;bottom:-26px;left:-16px;right:-16px;text-align:center;font-size:10.5px;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ladder-info{margin-top:42px;min-height:52px;font-size:15px;color:var(--gray-600);transition:opacity .25s}
  .ladder-info b{color:var(--black)}

  .sec{padding:68px 0}
  .sec.gray{background:var(--gray-100)}
  .sec h2{font-size:clamp(28px,4vw,38px);line-height:1.15;letter-spacing:-.02em;font-weight:800;margin-bottom:10px}
  .sec .sub{color:var(--gray-600);margin-bottom:32px;max-width:640px}
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .reveal.seen{opacity:1;transform:none}

  /* fan kartalari */
  .subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;perspective:1000px}
  .subj{--mx:50%;--my:50%;background:var(--white);border:1.5px solid var(--gray-200);border-radius:16px;padding:30px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;transition:border-color .25s,box-shadow .3s,transform .25s var(--ease);transform-style:preserve-3d}
  .subj::after{content:"";position:absolute;inset:0;background:radial-gradient(360px circle at var(--mx) var(--my),rgba(231,82,37,.10),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
  .subj:hover{border-color:var(--orange);box-shadow:0 26px 44px -28px rgba(29,29,27,.5)}
  .subj:hover::after{opacity:1}
  .subj .ic{width:60px;height:60px;background:var(--orange-50);border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--orange-700);transition:background .3s,color .3s,transform .4s var(--ease)}
  .subj:hover .ic{background:var(--orange);color:var(--white);transform:rotate(-8deg) scale(1.06)}
  .subj h3{font-size:26px;letter-spacing:-.02em;font-weight:800}
  .subj p{color:var(--gray-600);font-size:15.5px}
  .subj .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--gray-100);color:var(--graphite)}
  .subj .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid var(--gray-200);font-size:14px;font-weight:600;gap:10px}
  .subj .meta .go{color:var(--white);background:var(--orange);padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:6px;transition:gap .25s,background .25s}
  .subj:hover .meta .go{gap:12px;background:var(--orange-700)}
  .subj .done{position:absolute;top:22px;right:22px;font-size:12px;font-weight:700;background:var(--black);color:var(--white);padding:4px 10px;border-radius:999px;display:none}
  .subj.is-done .done{display:block}
  .soon{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;font-size:14px;color:var(--gray-600);align-items:center}
  .soon .chip{background:var(--white);border:1px dashed var(--gray-300)}

  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .step{border-top:3px solid var(--gray-200);padding-top:16px;position:relative}
  .step::before{content:"";position:absolute;top:-3px;left:0;height:3px;width:0;background:var(--orange);transition:width .9s var(--ease)}
  .step.seen::before{width:100%}
  .step .n{font-size:14px;font-weight:800;color:var(--orange-700);margin-bottom:6px}
  .step h3{font-size:18px;font-weight:700;margin-bottom:6px}
  .step p{font-size:15px;color:var(--gray-600)}
  .honest{margin-top:34px;background:var(--orange-25);border-left:4px solid var(--orange);padding:20px 22px;border-radius:0 12px 12px 0;font-size:15.5px}
  .honest b{display:block;margin-bottom:4px}

  /* ---------- TEST ---------- */
  .quiz{padding-top:34px;padding-bottom:72px}
  .qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
  .back{background:none;border:0;font-size:14px;font-weight:600;color:var(--gray-600);cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;transition:background .2s,color .2s}
  .back:hover{color:var(--black);background:var(--gray-100)}
  .qinfo{display:flex;gap:12px;align-items:center;font-size:14px;font-weight:700;color:var(--gray-600)}
  .qinfo .subjname{color:var(--orange-700)}
  .timer{font-variant-numeric:tabular-nums;background:var(--gray-100);padding:5px 10px;border-radius:999px}
  .segs{display:flex;gap:4px;margin-bottom:28px}
  .segs i{flex:1;height:6px;border-radius:3px;background:var(--gray-200);transition:background .35s,transform .35s var(--ease)}
  .segs i.done{background:var(--orange)}
  .segs i.cur{background:var(--orange-100);transform:scaleY(1.5)}
  .qcard{transition:opacity .22s,transform .22s var(--ease)}
  .qcard.out{opacity:0;transform:translateX(-24px)}
  .qcard.in{animation:qin .35s var(--ease)}
  @keyframes qin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  .qcount{font-size:13px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .qcount .tag{background:var(--orange-25);color:var(--orange-700);padding:4px 10px;border-radius:999px;letter-spacing:0;text-transform:none}
  .passage{background:var(--gray-100);border-left:3px solid var(--orange);padding:18px 20px;border-radius:0 12px 12px 0;font-size:16px;line-height:1.65;margin-bottom:20px}
  .qtext{font-size:clamp(22px,3.4vw,28px);line-height:1.3;font-weight:700;letter-spacing:-.015em;margin-bottom:24px}
  .qtext .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--orange);margin:0 4px;height:1em;vertical-align:-2px;animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{border-color:var(--orange-100)}}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:14px;text-align:left;background:var(--white);border:1.5px solid var(--gray-200);border-radius:12px;padding:16px 18px;font-size:17px;font-weight:500;cursor:pointer;transition:border-color .2s,background .2s,transform .2s var(--ease),box-shadow .2s;opacity:0;animation:opt .4s var(--ease) forwards}
  @keyframes opt{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .opt:hover{border-color:var(--black);transform:translateY(-2px);box-shadow:0 10px 20px -16px rgba(29,29,27,.5)}
  .opt .k{flex:none;width:32px;height:32px;border-radius:9px;background:var(--gray-100);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--gray-600);transition:background .2s,color .2s,transform .3s var(--ease)}
  .opt:hover .k{background:var(--black);color:var(--white)}
  .opt.sel{border-color:var(--orange);background:var(--orange-25);animation:pop .3s var(--ease)}
  .opt.sel .k{background:var(--orange);color:var(--white);transform:scale(1.1)}
  @keyframes pop{50%{transform:scale(1.03)}}
  .qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;flex-wrap:wrap}
  .skip{background:none;border:1.5px dashed var(--gray-300);border-radius:999px;padding:9px 16px;font-size:14.5px;font-weight:700;color:var(--gray-600);cursor:pointer;transition:border-color .2s,color .2s,background .2s}
  .skip:hover{color:var(--black);border-color:var(--black);background:var(--gray-100)}
  .qhint{font-size:13px;color:var(--gray-600)}
  .qhint kbd{font-family:inherit;font-weight:700;background:var(--gray-100);padding:2px 7px;border-radius:5px;border:1px solid var(--gray-200)}

  /* ---------- FORMA ---------- */
  .lead{padding-top:48px;padding-bottom:72px}
  .card{background:var(--white);border:1.5px solid var(--gray-200);border-radius:16px;padding:34px}
  .card h2{font-size:30px;letter-spacing:-.02em;font-weight:800;margin-bottom:8px}
  .card > p{color:var(--gray-600);margin-bottom:22px}
  .ready{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ok);background:#E7F4EC;padding:6px 12px;border-radius:999px;margin-bottom:14px}
  .blurlevel{display:flex;align-items:center;gap:16px;background:var(--gray-100);border-radius:12px;padding:16px 18px;margin-bottom:24px}
  .blurlevel b{font-size:40px;font-weight:800;filter:blur(9px);user-select:none;color:var(--orange);animation:shim 2s ease-in-out infinite}
  @keyframes shim{50%{filter:blur(12px);opacity:.7}}
  .blurlevel span{font-size:14px;color:var(--gray-600)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
  .field input,.field select{width:100%;border:1.5px solid var(--gray-200);border-radius:10px;padding:14px 16px;font:500 16px var(--sans);background:#fff;color:var(--black);outline:none;transition:border-color .2s,box-shadow .2s}
  .field input:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-25)}
  .phone{display:flex;border:1.5px solid var(--gray-200);border-radius:10px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
  .phone:focus-within{border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-25)}
  .phone span{padding:14px 12px 14px 16px;background:var(--gray-100);font-weight:700;color:var(--gray-600)}
  .phone input{border:0;border-radius:0;box-shadow:none!important}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .err{font-size:13.5px;color:#B3261E;margin-top:6px;display:none}
  .field.bad .err{display:block}
  .field.bad input,.field.bad .phone{border-color:#B3261E}
  .field.bad{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ---------- NATIJA ---------- */
  .result{padding-top:36px;padding-bottom:80px}
  .rtop{display:grid;grid-template-columns:auto 1fr;background:var(--black);color:var(--white);border-radius:18px;overflow:hidden;box-shadow:0 30px 50px -36px rgba(29,29,27,.8)}
  .rlevel{background:var(--orange);padding:34px 40px;display:flex;flex-direction:column;justify-content:center;min-width:220px;position:relative;overflow:hidden}
  .rlevel::after{content:"";position:absolute;right:-40px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
  .rlevel small{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
  .rlevel b{font-size:clamp(56px,9vw,88px);line-height:1;font-weight:800;letter-spacing:-.03em;display:inline-block}
  .rlevel b.roll{animation:roll .7s var(--ease)}
  @keyframes roll{0%{transform:translateY(40%) scale(.6);opacity:0}60%{transform:translateY(-6%) scale(1.06);opacity:1}100%{transform:none}}
  .rinfo{padding:30px 36px}
  .rinfo small{font-size:13px;color:#B5B5B0;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .rinfo h2{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;font-weight:800;margin:6px 0 10px}
  .rinfo p{color:#D9D8D4;font-size:16px}
  .rinfo .ielts{display:inline-block;margin-top:14px;font-size:14px;font-weight:700;border:1px solid #4A4A47;padding:6px 12px;border-radius:999px}
  .rladder{display:flex;gap:6px;margin:22px 0 6px}
  .rladder div{flex:1;text-align:center;padding:12px 4px;border-radius:10px;background:var(--gray-100);font-weight:800;font-size:15px;color:var(--gray-600);position:relative;opacity:0;animation:opt .4s var(--ease) forwards}
  .rladder div small{display:block;font-size:11px;font-weight:600;margin-top:2px}
  .rladder div.on{background:var(--orange);color:var(--white);box-shadow:0 12px 22px -14px rgba(231,82,37,.9)}
  .rladder div.below{background:var(--orange-50);color:var(--orange-700)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .card h3{font-size:19px;font-weight:800;margin-bottom:14px;letter-spacing:-.01em}
  .skills{display:grid;gap:14px}
  .sk .row{display:flex;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:6px}
  .sk .row span:last-child{color:var(--gray-600)}
  .sk .tr{height:8px;background:var(--gray-100);border-radius:4px;overflow:hidden}
  .sk .tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange-400),var(--orange));border-radius:4px;transition:width 1s var(--ease)}
  .cando{list-style:none;display:grid;gap:10px}
  .cando li{padding-left:26px;position:relative;font-size:15.5px}
  .cando li::before{content:"";position:absolute;left:0;top:7px;width:12px;height:7px;border-left:2.5px solid var(--orange);border-bottom:2.5px solid var(--orange);transform:rotate(-45deg)}
  .next{margin-top:16px;background:var(--orange-25);border:1.5px solid var(--orange-50);border-radius:16px;padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
  .next h3{font-size:21px;font-weight:800;margin-bottom:6px}
  .next p{font-size:15.5px;color:var(--graphite)}
  .next .btns{display:flex;gap:10px;flex-wrap:wrap}
  .disc{margin-top:16px;font-size:14px;color:var(--gray-600);background:var(--gray-100);padding:14px 16px;border-radius:12px}
  .ract{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
  .more > h3{font-size:22px;font-weight:800;margin:44px 0 16px}
  .more .subjects{grid-template-columns:repeat(2,1fr)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

  footer{border-top:1px solid var(--gray-200);padding:26px 0}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;font-size:14px;color:var(--gray-600);flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--black);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .4s var(--ease),opacity .3s;z-index:70;opacity:0}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1}

  @media (max-width:900px){
    .hero .wrap{grid-template-columns:1fr}
    .ladder{height:200px}
    .steps{grid-template-columns:1fr 1fr}
    .subjects{grid-template-columns:1fr 1fr}
  }
  @media (max-width:640px){
    body{font-size:16px}
    header .wrap{height:62px}
    .brand svg{height:30px}
    .hero{padding:36px 0 44px}
    .subjects,.more .subjects,.grid2,.row2,.opts{grid-template-columns:1fr}
    .steps{grid-template-columns:1fr}
    .rtop{grid-template-columns:1fr}
    .rlevel{flex-direction:row;align-items:baseline;gap:16px;padding:22px 24px}
    .rinfo{padding:22px 24px}
    .card{padding:24px}
    .next{grid-template-columns:1fr}
    .crumb{display:none}
    .qhint{display:none}
    .ladder{gap:6px}
    .ladder .st small{left:-2px;right:-2px;font-size:8.5px;white-space:normal;line-height:1.15;bottom:-24px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>

const L = x => (x && typeof x === "object" && !Array.isArray(x)) ? (x[LANG] ?? x.uz) : x;   // {uz,ru} → matn
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setHash(h){ try{ history.replaceState(null,"",(h ? "#"+h : location.pathname) + (h ? "" : location.search)); }catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const isLang = S => S.type === "lang";

/* =====================================================================
   7) ADAPTIV TEST
   theta — taxminiy daraja (0 = eng past). To‘g‘ri javobdan keyin oshadi, xatodan keyin kamayadi.
   Qadam asta-sekin kichrayadi, shunda daraja barqarorlashadi.
   Har bir darajada 20 tadan savol bor, ular tasodifiy tanlanadi va variantlar aralashtiriladi.
   ===================================================================== */
function startTest(key){
  const S = SUBJECTS[key], n = S.levels.length;
  stopAuto();
  Object.assign(state, { subj:key, theta:(n-1)/2, step:1, used:new Set(), log:[], cur:null, result:null });
  $("#qSubj").textContent = L(S.title); $("#crumb").textContent = L(S.title) + " · " + T("testOf");
  $("#qSegs").innerHTML = Array.from({length:S.count},()=>"<i></i>").join("");
  setHash(key);
  state.t0 = Date.now(); clearInterval(state.timer);
  state.timer = setInterval(()=>{ const s=Math.floor((Date.now()-state.t0)/1000); $("#qTimer").textContent = String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }, 1000);
  $("#qTimer").textContent = "00:00";
  show("quiz"); nextItem();
}
function pickItem(){
  const S = SUBJECTS[state.subj], n = S.levels.length;
  const target = Math.max(0, Math.min(n-1, Math.round(state.theta)));
  const lastSk = state.log.length ? S.items[state.log[state.log.length-1].i].sk : null;
  for (let d = 0; d < n; d++){
    for (const lv of (d ? [target-d, target+d] : [target])){
      if (lv < 0 || lv >= n) continue;
      const pool = S.items.map((it,i)=>({it,i})).filter(x=>x.it.lv===lv && !state.used.has(x.i));
      if (pool.length){
        const pref = pool.filter(x=>x.it.sk!==lastSk), src = pref.length ? pref : pool;
        return src[Math.floor(Math.random()*src.length)].i;
      }
    }
  }
  return null;
}
function paintItem(animate){
  const S = SUBJECTS[state.subj], it = S.items[state.cur], done = state.log.length;
  $$("#qSegs i").forEach((x,k)=>{ x.classList.toggle("done", k<done); x.classList.toggle("cur", k===done); });
  $("#qCount").textContent = T("qCount", {n:done+1, t:S.count});
  $("#qSkill").textContent = L(S.skills[it.sk]);
  $("#qPassage").innerHTML = it.p ? `<div class="passage">${esc(L(it.p))}</div>` : "";
  $("#qText").innerHTML = esc(L(it.q)).replace(/___/g, '<span class="blank"></span>');
  $("#qOpts").innerHTML = state.order.map((k,pos)=>`<button class="opt" data-k="${k}" style="animation-delay:${animate?pos*55:0}ms"><span class="k">${pos+1}</span><span>${esc(L(it.o[k]))}</span></button>`).join("");
  $$("#qOpts .opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k, b));
}
function nextItem(){
  const S = SUBJECTS[state.subj];
  if (state.log.length >= S.count){ finishTest(); return; }
  const i = pickItem(); if (i === null){ finishTest(); return; }
  state.used.add(i); state.cur = i;
  state.order = shuffle(S.items[i].o.map((_,k)=>k));
  const card = $("#qCard"); card.classList.remove("out"); paintItem(true);
  card.classList.remove("in"); void card.offsetWidth; card.classList.add("in");
}
let locked = false;
function answer(k, btn){
  const S = SUBJECTS[state.subj];
  if (locked || state.result || state.log.length >= S.count) return; locked = true;
  const it = S.items[state.cur], ok = k === it.a, n = S.levels.length;
  if (btn){ $$("#qOpts .opt").forEach(o=>o.classList.remove("sel")); btn.classList.add("sel"); }
  state.log.push({ i:state.cur, ok, k, theta:state.theta });
  state.theta = Math.max(0, Math.min(n-1, state.theta + (ok ? 1 : -1) * state.step));
  state.step = Math.max(0.3, state.step * 0.82);
  setTimeout(()=>{ $("#qCard").classList.add("out"); }, btn ? 230 : 0);
  setTimeout(()=>{ locked = false; nextItem(); }, btn ? 430 : 200);
}
$("#qSkip").onclick = () => answer(-1, null);
$("#qBack").onclick = () => { if (confirmLeave()) goHome(); };
function confirmLeave(){ return state.log.length < 3 || window.__leaveOk || (window.__leaveOk = true, toast(T("leave")), false); }
document.addEventListener("keydown", e=>{
  if (!$("#s-quiz").classList.contains("active") || e.target.closest("input,select,textarea")) return;
  const n = parseInt(e.key), btns = $("#qOpts").children;
  if (n >= 1 && n <= btns.length) btns[n-1].click();
  if (e.key === "s" || e.key === "S" || e.key === "ы" || e.key === "Ы") $("#qSkip").click();
});

/* ---------- Natijani hisoblash ---------- */
function scoreTest(){
  const S = SUBJECTS[state.subj], n = S.levels.length, log = state.log;
  const tail = log.slice(-6).map(x=>x.theta).concat([state.theta]);
  let lvl = Math.round(tail.reduce((a,b)=>a+b,0) / tail.length);
  const at = log.filter(x=>S.items[x.i].lv===lvl);
  if (lvl > 0 && at.length >= 2 && at.filter(x=>x.ok).length / at.length < 0.5) lvl--;
  lvl = Math.max(0, Math.min(n-1, lvl));
  const skills = Object.keys(S.skills).map(key=>{
    const xs = log.filter(x=>S.items[x.i].sk===key);
    return { key, total:xs.length, ok:xs.filter(x=>x.ok).length };
  }).filter(s=>s.total>0);
  return { lvl, skills, okCount:log.filter(x=>x.ok).length, total:log.length, secs:Math.round((Date.now()-state.t0)/1000) };
}
function finishTest(){
  clearInterval(state.timer); window.__leaveOk = false;
  state.result = scoreTest();
  $$("#qOpts .opt").forEach(o=>o.disabled = true);
  $$("#qSegs i").forEach(x=>{ x.classList.add("done"); x.classList.remove("cur"); });
  $("#blurLevel").textContent = SUBJECTS[state.subj].levels[state.result.lvl].code;
  setTimeout(()=>show("lead"), 300);
}

/* ---------- Konfetti (brend ranglarida) ---------- */
function confetti(){
  if (reduce) return;
  const c = $("#confetti"), x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#E75225","#EC703E","#F8C1A4","#1D1D1B","#FCDECC"];
  const ps = Array.from({length:140}, () => ({ x:W/2 + (Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*13-4, r:Math.random()*6+4, c:cols[Math.random()*cols.length|0], a:Math.random()*6, va:(Math.random()-.5)*.3 }));
  const t0 = performance.now();
  (function f(t){ x.clearRect(0,0,W,H); const age = (t-t0)/1000;
    ps.forEach(p=>{ p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.globalAlpha = Math.max(0, 1 - age/2.6); x.fillStyle = p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if (age < 2.6) requestAnimationFrame(f); else x.clearRect(0,0,W,H);
  })(t0);
}

const PDF_FONT_URL = "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/ptsans/";
let pdfFonts = null;
async function loadPdfFonts(){
  if (pdfFonts) return pdfFonts;
  const get = async f => { const r = await fetch(PDF_FONT_URL + f); if (!r.ok) throw new Error(f); const b = new Uint8Array(await r.arrayBuffer());
    let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  const [reg, bold] = await Promise.all([get("PT_Sans-Web-Regular.ttf"), get("PT_Sans-Web-Bold.ttf")]);
  pdfFonts = { reg, bold }; return pdfFonts;
}
function svgPathOps(d, ox, oy, k){
  const t = d.match(/[a-zA-Z]|-?\d*\.?\d+/g), ops = []; let i = 0, cmd = "", x = 0, y = 0, sx = 0, sy = 0;
  const num = () => parseFloat(t[i++]), P = (px, py) => [ox + px*k, oy + py*k];
  while (i < t.length){
    if (/[a-zA-Z]/.test(t[i])) cmd = t[i++];
    const rel = cmd === cmd.toLowerCase(), C = cmd.toUpperCase();
    if (C === "Z"){ ops.push({op:"h", c:[]}); x = sx; y = sy; continue; }
    if (C === "M"){ let nx = num(), ny = num(); if (rel){ nx += x; ny += y; } x = sx = nx; y = sy = ny; ops.push({op:"m", c:P(x,y)}); cmd = rel ? "l" : "L"; continue; }
    if (C === "L"){ let nx = num(), ny = num(); if (rel){ nx += x; ny += y; } x = nx; y = ny; ops.push({op:"l", c:P(x,y)}); continue; }
    if (C === "H"){ let nx = num(); x = rel ? x + nx : nx; ops.push({op:"l", c:P(x,y)}); continue; }
    if (C === "V"){ let ny = num(); y = rel ? y + ny : ny; ops.push({op:"l", c:P(x,y)}); continue; }
    if (C === "C"){ const v = [num(),num(),num(),num(),num(),num()]; if (rel){ for (let j=0;j<6;j+=2){ v[j]+=x; v[j+1]+=y; } }
      ops.push({op:"c", c:[...P(v[0],v[1]), ...P(v[2],v[3]), ...P(v[4],v[5])]}); x = v[4]; y = v[5]; continue; }
    i++;
  }
  return ops;
}
function drawLogo(doc, x, y, w){
  const svg = document.querySelector(".brand svg"), vb = svg.viewBox.baseVal, k = w / vb.width;
  svg.querySelectorAll("path").forEach(p => {
    const f = p.getAttribute("fill") || "#1D1D1B";
    doc.setFillColor(parseInt(f.slice(1,3),16), parseInt(f.slice(3,5),16), parseInt(f.slice(5,7),16));
    doc.path(svgPathOps(p.getAttribute("d"), x, y, k)); doc.fill();
  });
}
function buildPDF(fonts){
  const S = SUBJECTS[state.subj], R = state.result, Lv = S.levels[R.lvl], isEn = isLang(S), P = I18N[LANG].pdf;
  const doc = new jspdf.jsPDF({ unit:"mm", format:"a4", compress:true });
  let FAM = "helvetica";
  if (fonts){ doc.addFileToVFS("PTSans-Regular.ttf", fonts.reg); doc.addFont("PTSans-Regular.ttf", "PTSans", "normal");
              doc.addFileToVFS("PTSans-Bold.ttf", fonts.bold); doc.addFont("PTSans-Bold.ttf", "PTSans", "bold"); FAM = "PTSans"; }
  const W = 210, M = 18, CW = W - M*2;
  const rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const C = { or:"#E75225", or50:"#FCDECC", or25:"#FEF2EB", or700:"#B83A0E", bk:"#1D1D1B", g6:"#5C5C58", g2:"#E3E2DF", g1:"#F6F5F3", wh:"#FFFFFF" };
  const fill = c => doc.setFillColor(...rgb(c)), color = c => doc.setTextColor(...rgb(c)), stroke = c => doc.setDrawColor(...rgb(c));
  const F = b => doc.setFont(FAM, b ? "bold" : "normal");
  const LH = pt => pt * 0.3528 * 1.4;
  const d = new Date(), p2 = n => String(n).padStart(2,"0");
  const title = L(S.title), grp = groupName(S, Lv);

  try { drawLogo(doc, M, 13.5, 52); } catch(e){ console.warn("Logo chizilmadi", e); }
  color(C.bk); F(true); doc.setFontSize(11); doc.text(title + " · " + T("testOf"), W-M, 19, { align:"right" });
  color(C.g6); F(false); doc.setFontSize(9); doc.text(P.report + " · " + p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+d.getFullYear(), W-M, 24.5, { align:"right" });
  fill(C.or); doc.rect(M, 33, CW, 1.2, "F");

  let y = 46;
  color(C.g6); F(false); doc.setFontSize(9); doc.text(P.taker, M, y);
  color(C.bk); F(true); let ns = 24; doc.setFontSize(ns); while (doc.getTextWidth(state.lead.name) > CW && ns > 12){ ns--; doc.setFontSize(ns); } doc.text(state.lead.name, M, y+9.5);
  y += 17;

  const H = 43, lw = 56;
  fill(C.or); doc.rect(M, y, lw, H, "F");
  fill(C.or25); doc.rect(M+lw, y, CW-lw, H, "F");
  color(C.wh); F(true); doc.setFontSize(8.5); doc.text(isEn ? P.lvlCefr : P.lvl, M+8, y+10);
  doc.setFontSize(isEn ? 46 : 40); doc.text(Lv.code, M+8, y+31);
  const ix = M + lw + 9;
  color(C.or700); F(true); doc.setFontSize(8.5); doc.text(P.fit, ix, y+10);
  color(C.bk); F(true); let gs = 19; doc.setFontSize(gs); while (doc.getTextWidth(grp) > CW-lw-16 && gs > 12){ gs--; doc.setFontSize(gs); } doc.text(grp, ix, y+19);
  color(C.g6); F(false); let dfs = 9.2; doc.setFontSize(dfs);
  let dl = doc.splitTextToSize(L(Lv.desc), CW - lw - 18);
  if (dl.length > 2){ dfs = 8.3; doc.setFontSize(dfs); dl = doc.splitTextToSize(L(Lv.desc), CW - lw - 18); }
  doc.text(dl.slice(0,3), ix, y+25.5);
  color(C.or700); F(true); doc.setFontSize(8.8); doc.text(extraText(S, Lv), ix, y+39);
  y += H + 7;

  const n = S.levels.length, gap = 2.5, bw = (CW - gap*(n-1)) / n;
  S.levels.forEach((l,i)=>{
    const x = M + i*(bw+gap);
    fill(i===R.lvl ? C.or : (i<R.lvl ? C.or50 : C.g1)); doc.rect(x, y, bw, 13, "F");
    color(i===R.lvl ? C.wh : (i<R.lvl ? C.or700 : C.g6)); F(true); doc.setFontSize(11); doc.text(l.code, x+bw/2, y+6, { align:"center" });
    F(false); doc.setFontSize(7.2); doc.text(underLabel(S, l), x+bw/2, y+10.5, { align:"center" });
  });
  y += 13 + 10;

  const colW = (CW - 8) / 2;
  color(C.bk); F(true); doc.setFontSize(12); doc.text(P.bySkill, M, y); doc.text(P.can, M+colW+8, y);
  let ly = y + 8;
  R.skills.forEach(s=>{
    color(C.bk); F(false); doc.setFontSize(9.8); doc.text(L(S.skills[s.key]), M, ly);
    color(C.g6); doc.text(s.ok + " / " + s.total, M+colW, ly, { align:"right" });
    fill(C.g1); doc.roundedRect(M, ly+2, colW, 2.6, 1.3, 1.3, "F");
    if (s.ok) { fill(C.or); doc.roundedRect(M, ly+2, Math.max(colW*s.ok/s.total, 2.6), 2.6, 1.3, 1.3, "F"); }
    ly += 10;
  });
  color(C.g6); F(false); doc.setFontSize(8.2);
  const st = doc.splitTextToSize(P.total.replace("{ok}",R.okCount).replace("{t}",R.total), colW);
  doc.text(st, M, ly+1); ly += st.length * LH(8.2) + 2;
  let ry = y + 8; const cx = M + colW + 8;
  L(Lv.can).forEach(c=>{
    fill(C.or); doc.rect(cx, ry-2.6, 2.4, 2.4, "F");
    color(C.bk); F(false); doc.setFontSize(9.8);
    const t = doc.splitTextToSize(c, colW - 6); doc.text(t, cx+5, ry); ry += t.length * LH(9.8) + 3;
  });
  y = Math.max(ly, ry) + 6;

  if (R.lvl < S.levels.length - 1){
    const NX = S.levels[R.lvl + 1];
    stroke(C.g2); doc.setLineWidth(0.3); doc.rect(M, y, CW, 22, "S");
    color(C.g6); F(true); doc.setFontSize(8.5); doc.text(P.goal, M+7, y+7.5);
    color(C.bk); F(true); doc.setFontSize(12.5); doc.text(NX.code + " · " + grpShort(S, NX), M+7, y+14);
    color(C.g6); F(false); doc.setFontSize(9.2);
    const c0 = L(NX.can)[0];
    doc.text(doc.splitTextToSize(P.goalP + c0.charAt(0).toLowerCase() + c0.slice(1) + ".", CW - 70).slice(0,2), M+62, y+9.5);
    y += 22 + 5;
  }

  fill(C.or50); doc.rect(M, y, CW, 27, "F"); fill(C.or); doc.rect(M, y, 1.6, 27, "F");
  color(C.bk); F(true); doc.setFontSize(12); doc.text(isEn ? T("nextEn") : T("nextMath"), M+7, y+8.5);
  F(false); doc.setFontSize(9.5);
  doc.text(doc.splitTextToSize((isEn ? P.noteEn : "") + P.nextBody, CW-14), M+7, y+14.5);
  y += 27 + 6;

  color(C.g6); F(false); doc.setFontSize(8.4);
  doc.text(doc.splitTextToSize(P.discA + (isEn ? P.areasEn : P.areasMath) + P.discB, CW), M, y);

  const fy = 273;
  fill(C.g1); doc.rect(M, fy, CW, 13, "F"); fill(C.or); doc.rect(M, fy, CW, 0.8, "F");
  color(C.bk); F(true); doc.setFontSize(9.5); doc.text(P.contact, M+6, fy+8.4);
  F(true); color(C.or700);
  const tg = CONFIG.telegram.replace(/^@/,""), tel = CONFIG.phone.replace(/[^\d+]/g,"");
  const tx = M + 6 + doc.getTextWidth(P.contact) + 5, tgText = "Telegram: " + CONFIG.telegram;
  doc.textWithLink(tgText, tx, fy+8.4, { url:"https://t.me/" + tg });
  doc.textWithLink(T("tel") + ": " + CONFIG.phone, tx + doc.getTextWidth(tgText) + 10, fy+8.4, { url:"tel:" + tel });
  color(C.g6); doc.setFontSize(8); F(false);
  doc.text(P.center, M, 292);
  const site = /^https?:/.test(location.protocol) ? (location.host + location.pathname).replace(/index\.html$/,"").replace(/\/$/,"") : "";
  if (site) doc.textWithLink(site, W-M, 292, { url: location.origin + location.pathname, align:"right" });
  doc.setProperties({ title: title + " — " + state.lead.name, author: P.center });
  return doc;
}
async function downloadPDF(){
  if (!state.result || !state.lead) return;
  const btn = $("#pdfBtn"); btn.disabled = true;
  try{
    let fonts = null;
    try { fonts = await loadPdfFonts(); } catch(e){ console.warn("Shrift yuklanmadi:", e); if (LANG === "ru") throw e; }
    const doc = buildPDF(fonts);
    doc.save(("Registon_" + L(SUBJECTS[state.subj].title) + "_" + state.lead.name).replace(/[^\p{L}\p{N}]+/gu,"_") + ".pdf");
    toast(T("pdfOk"));
  }catch(err){ console.error(err); toast(T("pdfErr")); }
  btn.disabled = false;
}
